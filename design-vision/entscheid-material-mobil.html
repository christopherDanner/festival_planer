<!DOCTYPE html>
<!-- ENTSCHEID-PROTOTYP (wegwerfbar) — Wayfinder #66, Bereich Material.
     FRAGE: Wie wird am Handy die Gruppe gewählt (Achse C ist entschieden)?
     Auflage des Nutzers: Der Achsen-Umschalter (SORTIERT NACH) bleibt oben als Buttons wie am
     Desktop. Nur die Gruppen-Auswahl darunter darf NICHT als vollständige Reiter-Liste
     dastehen — zu viel Platzverlust. Drei Umsetzungen, gleiche Daten, 390px-Rahmen.
     Gemessen wird, wie viel Höhe bis zum Tabellenanfang draufgeht.
     Umschaltbar via ?v=1|2|3 oder Schalter unten. -->

</style>
</head>

];
const M=RAW.map((r,i)=>({id:'m'+i,name:r[0],category:r[1],station:r[2],supplier:r[3],packaging:r[4],ordered:r[5],actual:r[6],net:r[7],tax:r[8]}));
const NO_ST='Ohne Station', NO_SUP='Kein Lieferant';
const eur=n=>n==null?'–':n.toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const eur0=n=>n==null?'–':Math.round(n).toLocaleString('de-AT')+' €';
const gross=m=>m.net==null?null:m.net*(1+m.tax/100);
const total=m=>{const g=gross(m);return g==null?null:g*(m.actual??m.ordered);};
const sumOf=rs=>rs.reduce((s,m)=>s+(total(m)??0),0);
const noPrice=rs=>rs.filter(m=>m.net==null).length;
const AXKEY={station:m=>m.station??NO_ST, supplier:m=>m.supplier??NO_SUP, category:m=>m.category, all:()=>'Alle Positionen'};
function groups(ax){
  const map=new Map(); M.forEach(m=>{const k=AXKEY[ax](m); if(!map.has(k))map.set(k,[]); map.get(k).push(m);});
  const arr=[...map.entries()].map(([name,rows])=>({name,rows}));
  arr.sort((x,y)=>{const xs=x.name.startsWith('Ohne')||x.name.startsWith('Kein'),ys=y.name.startsWith('Ohne')||y.name.startsWith('Kein');
    if(xs!==ys)return xs?1:-1; return x.name.localeCompare(y.name,'de');});
  return arr;
}

    <div class="tablewrap"><table class="mtable">
      <thead><tr><th>Material</th>${showStation?'<th>Station</th>':''}<th>Lieferant</th><th>Gebinde</th>
        <th class="num">Best.</th><th class="num">Verbr.</th><th class="num">Δ</th><th class="num">Netto</th><th class="num">Gesamt</th><th></th></tr></thead>
      <tbody>${rows.map(m=>{
        const d=(m.actual==null)?null:m.actual-m.ordered;
        const dT=d==null?'<span class="none">–</span>':(d===0?'±0':`<span class="${d>0?'pos':'neg'}">${d>0?'+':''}${d}</span>`);
        return `<tr>
          <td><b>${m.name}</b><span class="sub"><span class="catbadge">${m.category}</span> · ${m.tax}%</span></td>
          ${showStation?`<td>${m.station??'<span class="none">–</span>'}</td>`:''}
          <td>${m.supplier??'<span class="none">–</span>'}</td><td>${m.packaging}</td>
          <td class="num">${m.ordered}</td><td class="num">${m.actual??'<span class="none">–</span>'}</td><td class="num">${dT}</td>
          <td class="num${m.net==null?' warncell':''}">${m.net==null?'FEHLT':eur(m.net)}</td>
          <td class="num">${m.net==null?'<span class="none">–</span>':`<b>${eur(total(m))}</b>`}</td>
          <td>⋮</td></tr>`;}).join('')}</tbody>
    </table></div></div>`;
}
function shellTop(ax){
  return `<div class="mast"><span class="wordmark">FESTMEISTER</span><h1>Musikfest Steinbach 2027</h1>
    <span class="when">in <b>62 Tagen</b> · 23.–25.07.2027</span></div>
   <div class="planbar"><input class="search" placeholder="Suche in 76 Positionen …"><button class="btn primary">+</button><button class="btn">⋯</button></div>
   <div class="modeline"><div class="seg"><button class="on">ARBEITSLISTE</button><button>ÜBERNAHME</button></div></div>
   <div class="axisline"><div class="axislbl">Sortiert nach</div>
     <div class="seg axisseg"><button data-ax="station" class="${ax==='station'?'on':''}">STATION</button><button data-ax="supplier" class="${ax==='supplier'?'on':''}">LIEFER.</button><button data-ax="category" class="${ax==='category'?'on':''}">KATEG.</button><button data-ax="all" class="${ax==='all'?'on':''}">ALLE</button></div></div>`;
}
const BOTTOM=`<div class="bottombar"><a href="#">Dash</a><a href="#">Schicht</a><a href="#" class="on">Material</a><a href="#">Ablauf</a><a href="#">Sponsor</a></div>`;

/* ---------- Die drei Umsetzungen ---------- */
function v1(ax, active){ // Dropdown
  const gs=groups(ax), g=gs.find(x=>x.name===active)??gs[0];
  const np=noPrice(g.rows);
  return shellTop(ax) + `<div style="padding:9px 12px 0">
    <select class="gsel">${gs.map(x=>`<option ${x.name===g.name?'selected':''}>${x.name} (${x.rows.length}) · ${eur0(sumOf(x.rows))}${noPrice(x.rows)?' · '+noPrice(x.rows)+' ohne Preis':''}</option>`).join('')}</select>
    ${np?`<div class="gselwarn">▲ ${np} Positionen ohne Preis in dieser Gruppe</div>`:''}
  </div>` + tableHTML(g.rows,g.name,ax!=='station','+ POSITION') + BOTTOM;
}
function v2(ax, active){ // Schublade
  const gs=groups(ax), g=gs.find(x=>x.name===active)??gs[0];
  const np=noPrice(g.rows);
  return shellTop(ax) + `<div style="padding:9px 12px 0">
    <button class="drawerbar js-open"><span class="nm">${g.name}</span><span class="ct">${g.rows.length} Pos · ${eur0(sumOf(g.rows))}</span>${np?`<span class="warn">${np} ⚠</span>`:''}<span class="chev">▾</span></button>
  </div>
  <div class="sheet"><div class="sheetinner">
    <div class="sheethead"><h4>Gruppe wählen</h4><button class="x js-close">FERTIG</button></div>
    <div class="sheetlist">${gs.map(x=>{const n=noPrice(x.rows);return `<button class="sheetrow ${x.name===g.name?'on':''}" data-g="${x.name}">
      <span><span class="nm">${x.name}</span><span class="sub" style="display:block">${x.rows.length} Positionen</span></span>
      <span class="r"><span style="font-weight:800;font-size:12.5px">${eur0(sumOf(x.rows))}</span>${n?`<span class="warn" style="display:block">${n} ohne Preis</span>`:'<span class="sub" style="display:block">✓ vollständig</span>'}</span></button>`;}).join('')}</div>
  </div></div>` + tableHTML(g.rows,g.name,ax!=='station','+ POSITION') + BOTTOM;
}
function v3(ax, active){ // scrollender Streifen
  const gs=groups(ax), g=gs.find(x=>x.name===active)??gs[0];
  return shellTop(ax) + `<div style="padding:9px 12px 0"><div class="strip">${gs.map(x=>{const n=noPrice(x.rows);
    return `<button class="chip ${x.name===g.name?'on':''}" data-g="${x.name}"><span class="nm">${x.name}</span><span class="n">${x.rows.length}</span>${n?'<span class="dot"></span>':''}</button>`;}).join('')}</div></div>`
    + tableHTML(g.rows,g.name,ax!=='station','+ POSITION') + BOTTOM;
}
const IMPL={1:{f:v1,name:'1 — Dropdown',hint:'ein Auswahlfeld, Gruppen als Options'},
            2:{f:v2,name:'2 — Schublade',hint:'Balken + Bottom-Sheet (Idiom aus #68)'},
            3:{f:v3,name:'3 — Scrollender Streifen',hint:'Reiter einzeilig, horizontal wischen'}};

/* ---------- Bühne: zwei Achsen nebeneinander ---------- */
let vi=1, state={station:null, supplier:null};
function build(){
  const impl=IMPL[vi];
  document.getElementById('stage').innerHTML=['station','supplier'].map(ax=>
    `<div class="phonewrap"><div class="phonelbl">Achse „${ax==='station'?'Station':'Lieferant'}" — ${groups(ax).length} Gruppen</div>
     <div class="phone" data-ax="${ax}">${impl.f(ax, state[ax])}</div></div>`).join('');
  // Interaktionen
  document.querySelectorAll('.phone').forEach(ph=>{
    const ax=ph.dataset.ax;
    ph.querySelectorAll('.js-open').forEach(b=>b.onclick=()=>ph.querySelector('.sheet').classList.add('open'));
    ph.querySelectorAll('.js-close').forEach(b=>b.onclick=()=>ph.querySelector('.sheet').classList.remove('open'));
    ph.querySelectorAll('.sheetrow,.chip').forEach(b=>b.onclick=()=>{state[ax]=b.dataset.g; build();});
    const sel=ph.querySelector('.gsel');
    if(sel) sel.onchange=()=>{state[ax]=sel.value.split(' (')[0]; build();};
  });
  measure();
}
function measure(){
  const out=[];
  document.querySelectorAll('.phone').forEach(ph=>{
    const k=ph.querySelector('.kasten'), top=ph.querySelector('.mast');
    out.push(Math.round(k.getBoundingClientRect().top - top.getBoundingClientRect().top));
  });
  const impl=IMPL[vi];
  document.getElementById('mbox').innerHTML=`<h4>Umsetzung ${impl.name}</h4>
    Höhe bis zum Tabellenanfang: <span class="px">${out[0]} px</span> (Achse Station, 8 Gruppen) ·
    <span class="px">${out[1]} px</span> (Achse Lieferant, 13 Gruppen).
    Von 780 px Schirmhöhe bleiben für die Tabelle <b>${780-out[1]} px</b>.
    <br><b>Gemessen:</b> alle drei Umsetzungen liegen bei 254–261 px — die Platzfrage ist von allen dreien
    gleich gut gelöst und entscheidet <i>nicht</i>. Die verworfene Vollliste aller Reiter kostet allein
    <span class="px">467 px</span> (Achse Lieferant) bzw. 269 px (Station) — die Sorge war also berechtigt.
    Entschieden wird nach: Überblick, Antipp-Wege, Gesten-Kollision.
    ${vi==1?'<span class="plus">+ konstant flach, egal wie viele Gruppen; Systemtastatur/Rad bedient es.</span> <span class="minus">− Warnungen nur als Text in der Option, kein Überblick auf einen Blick; im Ranking der Gruppen blind.</span>':''}
    ${vi==2?'<span class="plus">+ konstant flach UND der Überblick bleibt (Sheet zeigt €, Positionen, „ohne Preis" je Gruppe); gleiches Idiom wie die Helferliste-Schublade aus #68.</span> <span class="minus">− ein Antippen mehr bis zur Gruppe.</span>':''}
    ${vi==3?'<span class="plus">+ Wechsel ohne Zwischenschritt, direkt wischen.</span> <span class="minus">− versteckt Gruppen hinter dem Rand (bei 13 Lieferanten sieht man ~2,5); Wischen kollidiert mit dem horizontalen Scrollen der Tabelle direkt darunter.</span>':''}`;
  document.getElementById('slbl').innerHTML=impl.name+'<small>'+impl.hint+'</small>';
  history.replaceState(null,'','?v='+vi);
}
document.getElementById('prev').onclick=()=>{vi=vi===1?3:vi-1;build();};
document.getElementById('next').onclick=()=>{vi=vi===3?1:vi+1;build();};
vi=Math.min(3,Math.max(1,parseInt(new URLSearchParams(location.search).get('v')||'1',10)));
build();
</script>
</body>
</html>
